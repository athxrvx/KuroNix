[theme]
# Active colorscheme: the id of a [themes.<id>] table below.
scheme = "jellybeans"
mode = "auto"
gaps = 8

[fonts]
shell_font = "JetBrainsMono Nerd Font"
ui_size = 16
terminal_size = 11.5

[toolkit]
inherit_theme = true
font = "Fira Sans"
size = 10

[terminal]
opacity = 1.0
padding = 10
cursor_shape = "block"
scrollback = 10000

[niri]
# Niri compositor appearance and behavior.
border_size = 3
rounding = 10
blur = false
active_opacity = 1.0
inactive_opacity = 1.0
animations = true
shadow = true
shadow_range = 4
shadow_power = 3
shadow_color = "0x990d0d0d"
center_focused_column = "never"

[rules]
# Per-window rules are added with `kurogen window "<title>" "<Niri rule>"`.

[shell]
# Quickshell dimensions and icon sizing.
bar_height = 30
popup_gap = 14
radius = 0
radius_small = 0
padding = 16
gap = 10
icon_size = 20
